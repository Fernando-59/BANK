databases:
  - name: neabank-db
    plan: free
    databaseName: neabank
    user: neabank

services:
  - type: web
    name: neabank
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: neachatcharge@outlook.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: neabank-db
          property: connectionString
      - key: MAIL_EMAIL
        value: cgrute18@gmail.com
      - key: MAIL_PASSWORD
        value: mlauopdyrokibzxl
